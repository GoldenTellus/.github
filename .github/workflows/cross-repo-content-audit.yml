name: Cross-Repository Content Audit

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@v4
        with:
          repository: GoldenTellus/goldentellus-playbooks
          ref: main
          path: playbooks
          persist-credentials: false
      - name: Check out cases
        uses: actions/checkout@v4
        with:
          repository: GoldenTellus/goldentellus-cases
          ref: main
          path: cases
          persist-credentials: false
      - name: Check out knowledge
        uses: actions/checkout@v4
        with:
          repository: GoldenTellus/goldentellus-knowledge
          ref: main
          path: knowledge
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run cross-repository audit
        run: python playbooks/scripts/validate_content_links.py --cases cases --knowledge knowledge
